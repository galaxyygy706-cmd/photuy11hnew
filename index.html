<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Phở Hương Vị Việt - Order</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#15803d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Phở POS" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <div id="phone">

    <!-- Top bar -->
    <header id="topbar">
      <button id="btn-back" class="icon-btn" hidden aria-label="Quay lại">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="topbar-title">Phở Hương Vị Việt</h1>
      <button id="btn-notify" class="icon-btn" aria-label="Thông báo">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2a6 6 0 0 0-6 6v3.6c0 .5-.2 1-.6 1.4L4 15h16l-1.4-2c-.4-.4-.6-.9-.6-1.4V8a6 6 0 0 0-6-6z" fill="currentColor"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- Screens mount here -->
    <main id="screen"></main>

    <!-- Modal layer (customize item) -->
    <div id="modal-layer"></div>

    <!-- Toast for connection/save errors -->
    <div id="toast" hidden></div>

    <!-- Bottom nav -->
    <nav id="bottomnav">
      <button class="nav-item" data-nav="tables">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 7h18M3 12h18M3 17h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Bàn</span>
      </button>
      <button class="nav-item" data-nav="orders">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Order</span>
      </button>
      <button class="nav-item" data-nav="history">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Lịch sử</span>
      </button>
      <button class="nav-item" data-nav="more">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
        <span>Thêm</span>
      </button>
    </nav>

  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
